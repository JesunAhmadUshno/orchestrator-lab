name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests and layout check
        run: python -m unittest discover -s tests -v
      - name: results reproduced from the runners
        run: |
          python level-1-learn/run_learn.py
          python level-2-build/run_build.py
          python level-3-deep/run_deep.py
          python level-3-deep/sweep_deep.py
          git diff --exit-code -- level-1-learn level-2-build level-3-deep
